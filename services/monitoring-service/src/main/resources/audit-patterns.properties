# Audit log display patterns
# Format: ACTION_EntityType=Human-readable message
# Keys must match the pattern key used in audit events.
# Edit messages here to customize how audit actions appear in the UI.
# Changes require a service restart to take effect (overrides are saved in Redis and survive restarts).

# ── Job actions ─────────────────────────────────────────────────────────────
CREATE_Job=Create new job posting
UPDATE_Job=Update job posting
DELETE_Job=Delete job posting
VIEW_Job=View job posting details
PUBLISH_Job=Publish job posting
UNPUBLISH_Job=Unpublish job posting
CLOSE_Job=Close job posting
REOPEN_Job=Reopen job posting
SEARCH_Job=Search job postings
FILTER_Job=Filter job postings
EXPORT_Job=Export job posting list

# ── Application actions ──────────────────────────────────────────────────────
CREATE_Application=Create job application
SUBMIT_Application=Submit job application
UPDATE_Application=Update job application
WITHDRAW_Application=Withdraw job application
VIEW_Application=View job application
LIST_Application=View job application list
APPROVE_Application=Approve job application
REJECT_Application=Reject job application
REVIEW_Application=Review job application
SHORTLIST_Application=Add to shortlist
INTERVIEW_Application=Invite to interview
OFFER_Application=Send job offer letter
SEARCH_Application=Search job applications
FILTER_Application=Filter job applications
EXPORT_Application=Export application list

# ── Auth / Security (standalone — no entity type) ────────────────────────────
ENABLE_2FA=Enable two-factor authentication
DISABLE_2FA=Disable two-factor authentication
VERIFY_2FA=Verify 2FA code
VIEW_Sessions=View login sessions
LOGOUT_Session=Logout session
LOGOUT_ALL=Logout all sessions

