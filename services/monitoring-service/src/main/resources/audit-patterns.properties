# ════════════════════════════════════════════════════════════════════════════
# Audit event actions — exact strings published by business services to Kafka.
# These are matched by action name alone (entity type is already in the name).
# ════════════════════════════════════════════════════════════════════════════

# ── user-service audit events ────────────────────────────────────────────────
# Placeholders: {actor} = actorUsername, {target} = entityId
USER_APPROVED={actor} approved user account {target}
USER_REJECTED={actor} rejected user account {target}
USER_BLOCKED={actor} blocked user account {target}
USER_UNBLOCKED={actor} unblocked user account {target}
USER_DELETED={actor} deleted user account {target}

# ── application-service audit events ─────────────────────────────────────────
APP_CREATED={actor} created job application {target}
APP_STATUS_CHANGED={actor} updated status of application {target}
APP_WITHDRAWN={actor} withdrew job application {target}
APP_ASSIGNED={actor} assigned application {target} to reviewer
APP_OVERRIDE={actor} overrode application {target}
APPLICATION_SUBMITTED={actor} submitted job application {target}
APPLICATION_STATUS_CHANGED={actor} updated status of application {target}
APPLICATION_WITHDRAWN={actor} withdrew job application {target}
APPLICATION_NOTE_ADDED={actor} added a note to application {target}
APPLICATION_NOTE_UPDATED={actor} updated a note on application {target}
APPLICATION_NOTE_DELETED={actor} deleted a note from application {target}
APPLICATION_ASSIGNED={actor} assigned application {target} to a reviewer
APPLICATION_UNASSIGNED={actor} removed assignment from application {target}
APPLICATION_BULK_STATUS_CHANGED={actor} performed bulk status update on applications
APPLICATION_EXPORTED={actor} exported application data
APPLICATION_ADMIN_CREATED={actor} manually created application {target}
APPLICATION_ADMIN_OVERRIDE={actor} overrode application {target}
APPLICATION_ADMIN_RESTORED={actor} restored deleted application {target}
APPLICATION_ADMIN_DELETED={actor} permanently deleted application {target}

# ── auth-service audit events ────────────────────────────────────────────────
ROLE_GRANTED={actor} granted role {target}
ROLE_REVOKED={actor} revoked role {target}
AUTH_LOGIN_SUCCESS={actor} logged in successfully
AUTH_LOGIN_FAILED={actor} failed login attempt
AUTH_LOGOUT={actor} logged out
AUTH_REGISTER={actor} registered a new account
AUTH_OTP_VERIFIED={actor} verified OTP
AUTH_2FA_LOGIN_SUCCESS={actor} completed 2FA login
AUTH_2FA_LOGIN_FAILED={actor} failed 2FA login attempt
AUTH_PASSWORD_CHANGED={actor} changed password
AUTH_PASSWORD_FORGOT_REQUESTED={actor} requested password reset
AUTH_PASSWORD_RESET_OTP_VERIFIED={actor} verified password reset OTP
AUTH_PASSWORD_RESET={actor} reset password
AUTH_PASSWORD_SET={actor} set a new password
AUTH_2FA_ENABLED={actor} enabled two-factor authentication
AUTH_2FA_DISABLED={actor} disabled two-factor authentication
AUTH_OAUTH_LINKED={actor} linked OAuth provider
AUTH_OAUTH_UNLINKED={actor} unlinked OAuth provider
USER_APPROVED_HR_MANAGER={actor} approved HR Manager account {target}
USER_APPROVED_HR={actor} approved HR account {target}
AUTH_SESSION_DELETED={actor} deleted session {target}
AUTH_ALL_SESSIONS_DELETED={actor} deleted all sessions


# ── job-service audit events ─────────────────────────────────────────
JOB_CREATED={actor} created job posting {target}
JOB_UPDATED={actor} updated job posting {target}
JOB_STATUS_UPDATED={actor} updated status of job posting {target}
JOB_SOFT_DELETED={actor} soft deleted job posting {target}

SKILL_CREATED={actor} created skill {target}
SKILL_UPDATED={actor} updated skill {target}
SKILL_DELETED={actor} deleted skill {target}

COMPANY_CREATED={actor} created company {target}
COMPANY_UPDATED={actor} updated company {target}
COMPANY_DELETED={actor} deleted company {target}

COMPANY_CREATED={actor} created company {target}
