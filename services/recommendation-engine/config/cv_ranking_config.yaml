model_dir: /app/models/cv-refer

# Stage 1: Bi-Encoder + FAISS
top_k: 100
bi_encoder_model: bi-encoder     # subdir under model_dir (symlink or copy of job-recommend/bi-encoder-e5-large)

# Stage 2: Cross-Encoder
top_n: 20
cross_encoder_model: cross-encoder  # subdir under model_dir (symlink or copy of job-recommend/cross-encoder)

# Stage 3: T5 Explanation (optional — rule-based fallback used when absent)
t5_model: explanation-t5

# Score thresholds
# NOTE: recalibrated for new bi+cross model (v2). New model score distribution:
#       mean=51.8, median=48.5. Old model had mean~22 → old threshold 27 is now obsolete.
#       threshold=48 (median) gives balanced Good Fit / No Fit split.
min_score: 20.0
good_fit_threshold: 48.0

# Batch processing
batch_size: 32
device: cpu   # or "cuda" when GPU is available
