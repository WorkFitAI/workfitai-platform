name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Java services (8 services, parallel matrix) ───────────────────────────────
  test-java:
    name: Test / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - monitoring-service
          - notification-service
          - cv-service
          - job-service
          - user-service
          - application-service
          - auth-service
          - api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.service }}-${{ hashFiles(format('services/{0}/pom.xml', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ matrix.service }}-
            ${{ runner.os }}-maven-

      - name: Make mvnw executable
        run: chmod +x services/${{ matrix.service }}/mvnw

      - name: Run unit tests
        run: |
          services/${{ matrix.service }}/mvnw \
            -f services/${{ matrix.service }}/pom.xml \
            test \
            -Dspring.cloud.vault.enabled=false \
            -Dspring.cloud.consul.enabled=false \
            --no-transfer-progress

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  # ── Python service: recommendation-engine ────────────────────────────────────
  test-python:
    name: Test / recommendation-engine
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/recommendation-engine/requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd services/recommendation-engine
          pip install --quiet -r requirements-ci.txt

      - name: Run pytest
        run: |
          cd services/recommendation-engine
          mkdir -p target/surefire-reports target/site
          python -m pytest --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-recommendation-engine
          path: services/recommendation-engine/htmlcov/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-recommendation-engine
          path: services/recommendation-engine/target/surefire-reports/
          if-no-files-found: ignore

  # ── Summary gate ─────────────────────────────────────────────────────────────
  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-java, test-python]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.test-java.result }}" != "success" || "${{ needs.test-python.result }}" != "success" ]]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All tests passed"
